<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>fervor</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/favicon.ICO">
  <style>
    body {
      background: #fafafa;
    }
    .merch-header {
      position: relative;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .merch-back {
      position: absolute;
      top: 0.5rem;
      left: 11.5rem;
      text-decoration: none;
      color: #111;
      font-weight: 900;
      font-size: 2rem;
      background: none;
      border: none;
      box-shadow: none;
      cursor: pointer;
      padding: 0.5rem 1.2rem;
      line-height: 1;
      z-index: 10;
    }
    .arrow-back {
      font-size: 2.2rem;
      font-weight: bold;
      line-height: 1;
      display: inline-block;
      vertical-align: middle;
    }
    .merch-grid {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 3rem;
      margin: 3rem auto 0 auto;
      max-width: 1200px;
      width: 100%;
    }
    .merch-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      padding: 2.5rem 2.5rem 2rem 2.5rem;
      min-width: 340px;
      max-width: 400px;
      width: 100%;
      min-height: 480px;
      box-sizing: border-box;
    }
    .merch-img-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 180px;
      margin-bottom: 1.5rem;
    }
    .merch-card img {
      max-width: 180px;
      max-height: 180px;
      width: auto;
      height: auto;
      object-fit: contain;
      background: #f8f8f8;
      border-radius: 8px;
      display: block;
      margin: 0 auto;
    }
    .merch-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 0.7rem;
      gap: 1rem;
    }
    .merch-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: left;
      margin: 0 0 0.2rem 0;
      width: 100%;
    }
    .merch-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #111;
      margin-bottom: 0.5rem;   /* menos espacio debajo del precio */
      text-align: left;
      width: 100%;
    }
    .merch-desc {
      font-size: 1rem;
      color: #222;
      text-align: justify;
      width: 100%;
      margin-top: 0.5rem;
      margin-bottom: 0;
      flex: 1;
    }
    .merch-btn {
      padding: 0.5rem 1.2rem;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      background: #111;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 0.5rem;   /* menos espacio debajo del botón */
      margin-top: 0;           /* sin espacio extra arriba */
      margin-left: 0;
      display: inline-block;
      text-align: left;
    }
    .merch-btn:hover {
      background: #d32f2f;
    }
    @media (max-width: 900px) {
      .merch-grid {
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }
      .merch-card {
        min-width: 0;
        max-width: 420px;
        width: 90vw;
      }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html">
      <img src="assets/title_black.png" alt="FERVOR" class="logo-header" />
    </a>
  </header>
  <main style="position: relative;">
    <a href="index.html" class="merch-back" title="Volver atrás">
      <span class="arrow-back">&#8592;</span>
    </a>
    <section class="merch-grid">
      <div class="merch-card">
        <div class="merch-img-wrap">
          <img src="assets/merch/tote.png" alt="Tote bag FERVOR">
        </div>
        <div class="merch-title">Tote bag</div>
        <div class="merch-price">7&nbsp;€</div>
        <a href="compra.html"><button class="merch-btn">Comprar</button></a>
        <div class="merch-desc">
          Bolsa 180gr estilo tote bag de algodón en color negro con logo. De acabado cosido y asas largas reforzadas (70 x 2,5 cm). Resistencia hasta 10 kg de peso. Medida 36 x 40 cm.
        </div>
      </div>
      <div class="merch-card">
        <div class="merch-img-wrap">
          <img src="assets/merch/sticker.png" alt="Pegatinas FERVOR">
        </div>
        <div class="merch-title">Pegatinas</div>
        <div class="merch-price">2&nbsp;€</div>
        <a href="compra.html"><button class="merch-btn">Comprar</button></a>
        <div class="merch-desc">
          Pegatinas de material vinilo impreso. Medidas 30mm x 80mm.
        </div>
      </div>
    </section>
  </main>
</body>
</html>
